name: Deploy games to GitHub Pages

# Builds both games and publishes dist/ to the gh-pages branch, which GitHub Pages serves:
#   https://<owner>.github.io/<repo>/        farming game
#   https://<owner>.github.io/<repo>/truck/  Euro Haul
# Publishing to a branch works with the default token (no Pages admin setup needed in the workflow).

on:
  push:
    branches: [claude/mobile-farming-game-98iwkw, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist/ to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
